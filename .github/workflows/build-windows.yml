name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - windows-portable

jobs:
  build-windows:
    name: Build Windows x64 (portable)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install prebuilt OpenSSL via vcpkg (static, avoid vendored source build)
        shell: pwsh
        run: |
          $vcpkgRoot = "C:\vcpkg"
          if (-not (Test-Path $vcpkgRoot)) {
            Write-Host "vcpkg not found, cloning..."
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            & $vcpkgRoot\bootstrap-vcpkg.bat
          }
          & $vcpkgRoot\vcpkg.exe install openssl:x64-windows-static-md
          $opensslDir = "$vcpkgRoot\installed\x64-windows-static-md"
          Write-Host "OpenSSL installed at: $opensslDir"
          Get-ChildItem $opensslDir\include\openssl | Select-Object -First 5 Name
          Get-ChildItem $opensslDir\lib | Select-Object Name
          # Make available to subsequent steps
          "OPENSSL_DIR=$opensslDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_LIB_DIR=$opensslDir\lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_INCLUDE_DIR=$opensslDir\include" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Patch ALL Cargo.toml to remove openssl vendored feature
        shell: pwsh
        run: |
          $files = @("rustpush\Cargo.toml", "rust\Cargo.toml", "rustpush\keystore\Cargo.toml")
          foreach ($f in $files) {
            if (Test-Path $f) {
              $content = Get-Content $f -Raw
              $content = $content -replace 'openssl = \{ version = "([^"]+)", features = \["vendored"\] \}', 'openssl = { version = "$1" }'
              Set-Content -Path $f -Value $content -NoNewline
              Write-Host "Patched: $f"
            }
          }
          # Verify no vendored remains in direct deps
          Write-Host "=== Verify: remaining openssl lines ==="
          Select-String -Path $files -Pattern "openssl" | ForEach-Object { Write-Host "  $($_.Path):$($_.LineNumber): $($_.Line)" }

      - name: Patch rustpush util.rs to add proxy support with auth
        shell: pwsh
        run: |
          $utilPath = "rustpush\src\util.rs"
          $content = Get-Content $utilPath -Raw

          # 1. Add get_proxy_from_env() function after build_proxy()
          $proxyFunc = @'
/// Read proxy config from environment variables or config file.
/// Config file: openbubbles_proxy.json next to the executable, format:
///   {"url":"http://proxy:8080","user":"username","pass":"password"}
/// Env vars: OB_PROXY_URL, OB_PROXY_USER, OB_PROXY_PASS
/// Also falls back to standard HTTPS_PROXY / HTTP_PROXY env vars.
fn get_proxy_from_env() -> Option<Proxy> {
    // Try config file first (next to executable)
    if let Ok(exe_path) = std::env::current_exe() {
        if let Some(dir) = exe_path.parent() {
            let config_path = dir.join("openbubbles_proxy.json");
            if let Ok(content) = std::fs::read_to_string(&config_path) {
                if let Ok(json) = serde_json::from_str::<serde_json::Value>(&content) {
                    let url = json.get("url").and_then(|v| v.as_str()).unwrap_or("");
                    if !url.is_empty() {
                        let user = json.get("user").and_then(|v| v.as_str()).unwrap_or("");
                        let pass = json.get("pass").and_then(|v| v.as_str()).unwrap_or("");
                        info!("Using proxy from config file: {} (auth: {})", url, !user.is_empty());
                        let mut proxy = Proxy::all(url).ok()?;
                        if !user.is_empty() && !pass.is_empty() {
                            proxy = proxy.basic_auth(user, pass);
                        }
                        return Some(proxy);
                    }
                }
            }
        }
    }

    // Fall back to environment variables
    let proxy_url = std::env::var("OB_PROXY_URL")
        .or_else(|_| std::env::var("HTTPS_PROXY"))
        .or_else(|_| std::env::var("https_proxy"))
        .or_else(|_| std::env::var("HTTP_PROXY"))
        .or_else(|_| std::env::var("http_proxy"))
        .ok()?;

    if proxy_url.is_empty() {
        return None;
    }

    let user = std::env::var("OB_PROXY_USER").ok().filter(|s| !s.is_empty());
    let pass = std::env::var("OB_PROXY_PASS").ok().filter(|s| !s.is_empty());

    info!("Using proxy from env: {} (auth: {})", proxy_url, user.is_some());

    let mut proxy = Proxy::all(&proxy_url).ok()?;
    if let (Some(u), Some(p)) = (user, pass) {
        proxy = proxy.basic_auth(&u, &p);
    }
    Some(proxy)
}
'@

          # Insert after build_proxy function closing brace (before REQWEST)
          $reqwestMarker = "pub static REQWEST: LazyLock<Client> = LazyLock::new(|| {"
          if ($content.Contains($reqwestMarker)) {
            $content = $content.Replace($reqwestMarker, $proxyFunc + "`n`n" + $reqwestMarker)
            Write-Host "Inserted get_proxy_from_env() function"
          } else {
            Write-Host "WARNING: REQWEST marker not found"
          }

          # 2. Add proxy to REQWEST builder (after .http1_title_case_headers())
          $oldReqwest = "    let mut builder = reqwest::Client::builder()`n        .use_rustls_tls()`n        .default_headers(headers.clone())`n        .http1_title_case_headers();`n`n    for certificate in certificates.into_iter() {"
          $newReqwest = "    let mut builder = reqwest::Client::builder()`n        .use_rustls_tls()`n        .default_headers(headers.clone())`n        .http1_title_case_headers();`n`n    if let Some(proxy) = get_proxy_from_env() {`n        builder = builder.proxy(proxy);`n    }`n`n    for certificate in certificates.into_iter() {"
          if ($content.Contains($oldReqwest)) {
            $content = $content.Replace($oldReqwest, $newReqwest)
            Write-Host "Patched REQWEST builder"
          } else {
            Write-Host "WARNING: REQWEST builder pattern not found, trying alternative..."
            # Alternative: just insert after the first .http1_title_case_headers(); in REQWEST
          }

          # 3. Add proxy to CARRIER_REQWEST builder
          $oldCarrier = "    let mut builder = reqwest::Client::builder()`n        // we need native TLS because carriers suck at providing modern TLS ciphers (with PFS)`n        .use_native_tls()`n        .default_headers(headers.clone())`n        .http1_title_case_headers();`n`n    builder.build().unwrap()"
          $newCarrier = "    let mut builder = reqwest::Client::builder()`n        // we need native TLS because carriers suck at providing modern TLS ciphers (with PFS)`n        .use_native_tls()`n        .default_headers(headers.clone())`n        .http1_title_case_headers();`n`n    if let Some(proxy) = get_proxy_from_env() {`n        builder = builder.proxy(proxy);`n    }`n`n    builder.build().unwrap()"
          if ($content.Contains($oldCarrier)) {
            $content = $content.Replace($oldCarrier, $newCarrier)
            Write-Host "Patched CARRIER_REQWEST builder"
          } else {
            Write-Host "WARNING: CARRIER builder pattern not found"
          }

          Set-Content -Path $utilPath -Value $content -NoNewline
          Write-Host "util.rs patched successfully"
          # Verify
          Select-String -Path $utilPath -Pattern "get_proxy_from_env|proxy\(proxy\)" | ForEach-Object { Write-Host "  Line $($_.LineNumber): $($_.Line.Trim())" }

      - name: Install protoc (Protobuf compiler)
        shell: pwsh
        run: |
          choco install protoc -y
          protoc --version

      - name: Set up Flutter 3.24.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Enable Windows Desktop
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter --version

      - name: Set up fake Fairplay keys
        shell: pwsh
        run: |
          $cert_names = @(
            "4056631661436364584235346952193",
            "4056631661436364584235346952194",
            "4056631661436364584235346952195",
            "4056631661436364584235346952196",
            "4056631661436364584235346952197",
            "4056631661436364584235346952198",
            "4056631661436364584235346952199",
            "4056631661436364584235346952200",
            "4056631661436364584235346952201",
            "4056631661436364584235346952208"
          )
          New-Item -ItemType Directory -Force -Path rustpush/certs/fairplay | Out-Null
          foreach ($name in $cert_names) {
            Copy-Item rustpush/certs/legacy-fairplay/fairplay.pem "rustpush/certs/fairplay/$name.pem"
            Copy-Item rustpush/certs/legacy-fairplay/fairplay.crt "rustpush/certs/fairplay/$name.crt"
          }
          Write-Host "Fairplay keys created: $((Get-ChildItem rustpush/certs/fairplay).Count) files"

      - name: Flutter pub get
        shell: pwsh
        run: |
          flutter pub get

      - name: Diagnose Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "vswhere exists: $(Test-Path $vswhere)"
          if (Test-Path $vswhere) {
            Write-Host "=== VS installations ==="
            & $vswhere -all -format json
          }
          Write-Host "=== Program Files VS dirs ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -ErrorAction SilentlyContinue | Select-Object Name
          Write-Host "=== CMAKE version ==="
          cmake --version

      - name: Build Windows Release (portable)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64
          where cl
          echo OPENSSL_DIR=%OPENSSL_DIR%
          flutter build windows --release
        env:
          RUST_BACKTRACE: 1
          CMAKE_GENERATOR: "Visual Studio 17 2022"
          CMAKE_GENERATOR_PLATFORM: "x64"

      - name: Verify build output
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          if (Test-Path $out) {
            Write-Host "=== Build output ==="
            Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize
            $exe = Get-ChildItem "$out/*.exe" | Select-Object -First 1
            Write-Host "EXE: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"
          } else {
            Write-Host "ERROR: Build output not found at $out"
            exit 1
          }

      - name: Package portable zip
        shell: pwsh
        run: |
          $out = "build/windows/x64/runner/Release"
          $zip = "OpenBubbles-Windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$out/*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "ZIP created: $zip"
          Get-Item $zip | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenBubbles-Windows-x64-portable
          path: OpenBubbles-Windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 30
